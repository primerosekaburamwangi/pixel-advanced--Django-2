<!DOCTYPE html>
<html>

<head>
    <title>Contact Us</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            margin: 0;
            padding: 40px 15px;
        }

        .container {
            background: white;
            max-width: 500px;
            margin: auto;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 5px 20px #0001;
        }

        h2 {
            text-align: center;
            color: #1e293b;
        }

        p {
            text-align: center;
            color: #64748b;
        }

        input,
        textarea {
            width: 100%;
            padding: 13px;
            margin: 10px 0;
            border: 1px solid #cbd5e1;
            border-radius: 6px;
            font-size: 14px;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        input:focus,
        textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        button {
            width: 100%;
            padding: 13px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background: #1d4ed8;
        }

        .success {
            color: green;
            text-align: center;
        }
    </style>
</head>

<body>
    

    <div class="container">

        <h2>Contact Us</h2>
        <p>We would love to hear from you.</p>

        {% for message in messages %}
        <div class="success">{{ message }}</div>
        {% endfor %}

        <form method="POST">

            {% csrf_token %}

            <input type="text" name="full_name" placeholder="Your Full Name" required>

            <input type="email" name="email" placeholder="Your Email Address" required>

            <input type="text" name="subject" placeholder="Subject" required>

            <textarea name="message" placeholder="Write your message..." required></textarea>

            <button type="submit">Send Message</button>

        </form>

    </div>

</body>

</html>
